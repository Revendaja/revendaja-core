# fly.toml app configuration file generated for revendaja-core on 2026-11-02T12:13:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'revendaja-core'
primary_region = 'gru'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
