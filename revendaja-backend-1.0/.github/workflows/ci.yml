name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revendaja
          POSTGRES_PASSWORD: revendaja
          POSTGRES_DB: revendaja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revendaja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://revendaja:revendaja@localhost:5432/revendaja?schema=public
      JWT_SECRET: ci-only-secret-not-used-in-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - run: npm run build
